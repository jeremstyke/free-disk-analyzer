name: Build

# Covers FreeDiskAnalyzer.Core and its tests. The WPF project
# (src/FreeDiskAnalyzer) will be added to FreeDiskAnalyzer.sln in a later
# phase; once it exists, this workflow will build and it does not need
# further changes.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FreeDiskAnalyzer.sln

      - name: Build
        run: dotnet build FreeDiskAnalyzer.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FreeDiskAnalyzer.sln --configuration Release --no-build --verbosity normal
